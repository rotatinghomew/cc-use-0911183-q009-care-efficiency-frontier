[project]
name = "care-efficiency-frontier"
version = "0.1.0"
description = "养老院区投入产出边界与可达改进组合的业务数据服务"
requires-python = ">=3.11"
dependencies = ["numpy==2.2.6", "scipy==1.15.3"]

[build-system]
requires = ["setuptools==75.8.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["frontier"]

[tool.unittest]
start-directory = "tests"
